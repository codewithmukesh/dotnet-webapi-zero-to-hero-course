services:
  postgres:
    image: postgres:latest
    container_name: healthchecks-postgres
    environment:
      POSTGRES_DB: healthchecks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: healthchecks-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Stands in for the downstream payments API. Answers 200 on any path, so both
  # the AddUrlGroup check (/health/live) and PaymentGatewayHealthCheck (/ping)
  # hit something real instead of a third-party URL you would be billed for.
  payments:
    image: traefik/whoami:latest
    container_name: healthchecks-payments
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
